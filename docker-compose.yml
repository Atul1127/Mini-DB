services:
  mini-db:
    build: .
    container_name: mini-db
    volumes:
      - mini-db-data:/app/data
      - mini-db-logs:/app/logs
    expose:
      - "18080"
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: mini-db-gateway
    environment:
      DB_URL: http://mini-db:18080
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-mini-db-development-secret-change-me}
      CACHE_TTL: 30
    ports:
      - "8080:8080"
    depends_on:
      - mini-db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mini-db-redis
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  mini-db-data:
  mini-db-logs:
