services:
  mini-db:
    build: .
    container_name: mini-db
    volumes:
      - mini-db-data:/app/data
      - mini-db-logs:/app/logs
    expose:
      - "18080"
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: mini-db-gateway
    environment:
      DB_URL: http://mini-db:18080
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-mini-db-development-secret-change-me}
      CACHE_TTL: 30
    ports:
      - "8080:8080"
    depends_on:
      - mini-db
      - redis
      - kafka
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mini-db-redis
    expose:
      - "6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    container_name: mini-db-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    expose:
      - "9092"
    restart: unless-stopped

volumes:
  mini-db-data:
  mini-db-logs:
